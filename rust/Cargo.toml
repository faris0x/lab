[workspace]
members = ["crates/mathcore", "crates/simplex", "crates/linalg", "crates/complexnum", "crates/graphnet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
